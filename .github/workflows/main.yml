name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Inspect applicationId and write google-services.json
        run: |
          grep -E "applicationId|namespace" app/build.gradle.kts || true
          python3 - << 'PY'
          import json, os

          pkg = "com.aistudio.dossierangel.wrapkp"
          data = {
              "project_info": {
                  "project_number": "1234567890",
                  "project_id": "dossier-angel-placeholder",
                  "storage_bucket": "dossier-angel-placeholder.appspot.com"
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                          "android_client_info": {
                              "package_name": pkg
                          }
                      },
                      "oauth_client": [],
                      "api_key": [
                          {
                              "current_key": "AIzaSyPlaceholderKeyForDebugBuildOnly"
                          }
                      ],
                      "services": {
                          "appinvite_service": {
                              "other_platform_oauth_client": []
                          }
                      }
                  }
              ],
              "configuration_version": "1"
          }
          os.makedirs("app", exist_ok=True)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("WROTE app/google-services.json FOR:", pkg)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dossier-angel-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
